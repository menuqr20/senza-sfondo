<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Senza sfondo">
<meta name="theme-color" content="#111111">
<title>Senza sfondo</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#222;--ac:#2a6df4;--sc:#ddd;--sc2:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--tx:#eee;--sc:#333;--sc2:#444}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);
padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0 0 14px}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:15px;
font-size:17px;font-weight:600;text-align:center;margin-bottom:10px}
.btn.sec{background:var(--card);color:var(--ac);border:1px solid var(--ac)}
select{width:100%;padding:12px;border-radius:10px;font-size:16px;margin-bottom:10px;background:var(--card);color:var(--tx);border:1px solid var(--sc)}
#stato{margin:10px 0;font-size:15px;min-height:22px}
#bar{height:6px;background:var(--sc);border-radius:3px;overflow:hidden;margin-bottom:14px}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.griglia{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border-radius:12px;padding:8px;font-size:13px}
.card img{width:100%;border-radius:8px;display:block;
background:repeating-conic-gradient(var(--sc) 0 25%,var(--sc2) 0 50%) 0 0/16px 16px}
.card .r{display:flex;gap:6px;margin-top:6px}
.card button{flex:1;border:0;border-radius:8px;padding:10px;background:var(--ac);color:#fff;font-size:14px}
.card button.g{background:var(--sc);color:var(--tx)}
#ed{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;
padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#area{flex:1;overflow:auto;border-radius:10px;background:#888}
#cv{display:block;width:100%;touch-action:none;
background:repeating-conic-gradient(var(--sc) 0 25%,var(--sc2) 0 50%) 0 0/16px 16px}
.tb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tb button{flex:1;min-width:70px;border:0;border-radius:8px;padding:11px 6px;background:var(--card);color:var(--tx);font-size:14px}
.tb button.on{background:var(--ac);color:#fff}
.tb label{flex:1 1 45%;font-size:12px}
.tb input{width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Senza sfondo</h1>
<select id="q">
<option value="isnet_quint8">Veloce (meno preciso)</option>
<option value="isnet_fp16" selected>Alta qualità (consigliato)</option>
<option value="isnet">Massima (lento, può non funzionare su iPhone vecchi)</option>
</select>
<label class="btn" for="file">Scegli le foto</label>
<input id="file" type="file" accept="image/*" multiple hidden>
<button id="tutte" class="btn sec" hidden>Salva / condividi tutte</button>
<div id="stato">Pronto. La prima volta scarica il modello, poi è più veloce.</div>
<div id="bar"><i></i></div>
<div class="griglia" id="griglia"></div>

<div id="ed" hidden>
<div id="area"><canvas id="cv"></canvas></div>
<div class="tb">
<button id="mC" class="on">Cancella</button>
<button id="mR">Ripristina</button>
<button id="mS">Sposta</button>
</div>
<div class="tb">
<label>Pennello<input id="sz" type="range" min="4" max="80" value="24"></label>
<label>Zoom<input id="zm" type="range" min="1" max="4" step="0.1" value="1"></label>
</div>
<div class="tb">
<button id="ann">Annulla modifiche</button>
<button id="fine" class="on">Fine</button>
</div>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

const MAX = 2048;
const $ = id => document.getElementById(id);
const stato = $("stato"), barra = document.querySelector("#bar i"), griglia = $("griglia"), tutte = $("tutte");
let items = [];

async function ridimensiona(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  return c;
}
const toBlob = (c, t, q) => new Promise(r => c.toBlob(r, t, q));

async function condividi(files) {
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) {}
  } else alert("Condivisione non disponibile: tieni premuta l’immagine e scegli Salva.");
}
async function aggiorna(it) {
  const blob = await toBlob(it.res, "image/png");
  it.file = new File([blob], it.nome, { type: "image/png" });
  it.img.src = URL.createObjectURL(blob);
}

$("file").onchange = async e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  griglia.innerHTML = ""; items = []; tutte.hidden = true;
  for (let i = 0; i < files.length; i++) {
    const nome = files[i].name.replace(/\.[^.]+$/, "") + ".png";
    stato.textContent = "Elaboro " + (i + 1) + " di " + files.length + "…";
    barra.style.width = (i / files.length * 100) + "%";
    try {
      const orig = await ridimensiona(files[i]);
      const out = await removeBackground(await toBlob(orig, "image/jpeg", 0.95), {
        model: $("q").value,
        output: { format: "image/png" },
        progress: (k, cur, tot) => { if (k.startsWith("fetch")) stato.textContent = "Scarico il modello… " + Math.round(cur / tot * 100) + "%"; }
      });
      const bmp = await createImageBitmap(out);
      const res = document.createElement("canvas");
      res.width = bmp.width; res.height = bmp.height;
      res.getContext("2d").drawImage(bmp, 0, 0);
      const base = document.createElement("canvas");
      base.width = res.width; base.height = res.height;
      base.getContext("2d").drawImage(res, 0, 0);
      const it = { nome, orig, res, base };
      const c = document.createElement("div"); c.className = "card";
      it.img = document.createElement("img"); c.appendChild(it.img);
      const r = document.createElement("div"); r.className = "r";
      const b1 = document.createElement("button"); b1.className = "g"; b1.textContent = "Ritocca"; b1.onclick = () => apri(it);
      const b2 = document.createElement("button"); b2.textContent = "Salva"; b2.onclick = () => condividi([it.file]);
      r.append(b1, b2); c.appendChild(r); griglia.appendChild(c);
      await aggiorna(it); items.push(it);
    } catch (err) {
      const c = document.createElement("div"); c.className = "card";
      c.textContent = "Errore su " + files[i].name + ". Prova il modello Veloce."; griglia.appendChild(c);
    }
  }
  barra.style.width = "100%";
  stato.textContent = "Finito: " + items.length + " foto su " + files.length + ". Tocca Ritocca per sistemare i bordi.";
  tutte.hidden = items.length === 0;
};
tutte.onclick = () => condividi(items.map(i => i.file));

// ---- Ritocco ----
const cv = $("cv"), ctx = cv.getContext("2d");
let cur = null, modo = "C", giu = false, ultimo = null;
function modoSet(m) {
  modo = m;
  ["C", "R", "S"].forEach(k => $("m" + k).classList.toggle("on", k === m));
  cv.style.touchAction = m === "S" ? "auto" : "none";
}
$("mC").onclick = () => modoSet("C"); $("mR").onclick = () => modoSet("R"); $("mS").onclick = () => modoSet("S");
$("zm").oninput = e => { cv.style.width = (e.target.value * 100) + "%"; };
function apri(it) {
  cur = it; cv.width = it.res.width; cv.height = it.res.height;
  ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(it.res, 0, 0);
  cv.style.width = "100%"; $("zm").value = 1; modoSet("C"); $("ed").hidden = false;
}
function punto(e) {
  const r = cv.getBoundingClientRect(), s = cv.width / r.width;
  return { x: (e.clientX - r.left) * s, y: (e.clientY - r.top) * s, s };
}
function pennella(p) {
  const rad = $("sz").value * (cv.width / 1000);
  ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); 
  if (modo === "C") { ctx.globalCompositeOperation = "destination-out"; ctx.fill(); }
  else { ctx.clip(); ctx.drawImage(cur.orig, 0, 0, cv.width, cv.height); }
  ctx.restore();
}
function tratto(a, b) {
  const d = Math.hypot(b.x - a.x, b.y - a.y), passo = Math.max(1, $("sz").value * (cv.width / 1000) / 3);
  for (let t = 0; t <= d; t += passo) pennella({ x: a.x + (b.x - a.x) * t / (d || 1), y: a.y + (b.y - a.y) * t / (d || 1) });
}
cv.onpointerdown = e => { if (modo === "S") return; giu = true; cv.setPointerCapture(e.pointerId); ultimo = punto(e); pennella(ultimo); };
cv.onpointermove = e => { if (!giu) return; const p = punto(e); tratto(ultimo, p); ultimo = p; };
cv.onpointerup = cv.onpointercancel = () => { giu = false; };
$("ann").onclick = () => { cur.res.getContext("2d").clearRect(0, 0, cur.res.width, cur.res.height); cur.res.getContext("2d").drawImage(cur.base, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(cur.base, 0, 0); };
$("fine").onclick = async () => {
  const x = cur.res.getContext("2d"); x.clearRect(0, 0, cur.res.width, cur.res.height); x.drawImage(cv, 0, 0);
  await aggiorna(cur); $("ed").hidden = true;
};
</script>
</body>
</html>
